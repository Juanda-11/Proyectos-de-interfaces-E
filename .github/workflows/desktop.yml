name: Desktop

# Genera los instaladores de escritorio (Windows, macOS y Linux).
# - Manual: Actions → Desktop → Run workflow; los instaladores quedan como artefactos de la ejecución.
# - Con una etiqueta de versión (p. ej. v1.0.0) también se publican en una Release de GitHub.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            name: windows
          - os: ubuntu-latest
            flag: --linux
            name: linux
          - os: macos-latest
            flag: --mac
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # Sin firma de código: los instaladores no están firmados ni notarizados
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: hydrograph-ai-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true

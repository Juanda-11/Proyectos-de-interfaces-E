<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HydroGraph AI: diseña, simula y audita redes de suministro de agua con ayuda de IA."
    />
    <meta name="theme-color" content="#0F172A" />
    <meta property="og:title" content="HydroGraph AI" />
    <meta
      property="og:description"
      content="Editor visual de redes de agua con simulación hidráulica y copiloto de IA."
    />
    <meta property="og:type" content="website" />
    <title>HydroGraph AI</title>
    <script>
      // Aplica el tema y el idioma guardados antes de pintar, para evitar un parpadeo
      try {
        var theme = localStorage.getItem('hydrograph-ai:theme')
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        var lang =
          localStorage.getItem('hydrograph-ai:lang') || (navigator.language || 'es').slice(0, 2)
        document.documentElement.lang = lang === 'en' ? 'en' : 'es'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>HydroGraph AI necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
